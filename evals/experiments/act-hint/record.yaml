conclusion:
  interpretation: recorded_null
  condition: nothing moves beyond its interval
  read: a recorded null. A null with control AT OR NEAR CEILING on the genuine half is recorded as NO
    HEADROOM, not as no effect -- the instrument had nowhere to move, which is a different finding and
    a different follow-up. The read then rests on the DECOY side, where the habituation cost is visible
    whatever the genuine ceiling does, and on wide - inert.
  basis: 'wide_minus_control = 0.0208 [-0.0223, 0.0639] over 24 cluster(s); inert_minus_control = 0.0208
    [-0.0223, 0.0639]; wide_minus_inert = 0.0 [-0.0623, 0.0623]. A contrast moves when its two-sided interval
    excludes 0 and its estimate reaches the declared MEWD of 0.15. Moved: wide_minus_control=False, inert_minus_control=False,
    wide_minus_inert=False.'
  alike: true
  alike_basis: 'ALIKE is decided by the frozen secondary: wide_minus_inert = 0.0 [-0.0623, 0.0623], which
    does NOT clear the declared MEWD of 0.15 with an interval covering 0. It qualifies the `preamble_only`
    leg only; the other three legs do not use the word.'
  moved:
    wide_minus_control: false
    inert_minus_control: false
    wide_minus_inert: false
  instrument_noise: false
  control_genuine_rate: 0.0
  headroom: 1.0
  no_headroom: false
  headroom_rule: 'headroom = 1 - the control arm''s rate on the genuine half; below one declared MEWD
    (0.15) there is no room for any arm to move into. The flag is scoped to the RECORDED NULL, where the
    frozen text puts it: a null there is recorded as NO HEADROOM rather than as no effect, and the read
    rests on the decoy side and on wide - inert. Under any other leg something moved, which is itself
    proof there was room.'
  rollout_precondition: whether the live UserPromptSubmit hook delivers this same text inside a production
    spawn is NOT measured here, and neither is candidate displacement under the live nine-row router_rules.json.
    Both are named preconditions for any production rollout of a row, not results of this run.
updates:
  certainty: low
  downgrade_reasons:
  - contamination_familiarity
  - model_version_drift
  - nondeterminism
  - construct_validity_proxy
  - token_length_confound
  - selection_exclusion
  - generalization
  - custom_candidate_displacement
  - custom_language_delivery
  prior:
    belief: 'from the founding RG-2x2 (this record''s chain prior): register is null -- reg == ctrl in
      both tiers -- while the gate''s forced deliberation raised the disciplinary footprint from 18/48
      to 36/48 as an exploratory signal, with the skill never loaded in any arm. The frozen baseline_expectation
      carries that across as a WIDE genuine-side prior rather than a point estimate: every arm here loads
      the skill, so control measures the skill''s own trigger surface with no hint, the hint effect is
      marginal over that, and the prior''s upper tail is a ceiling risk rather than a compression risk.'
    grade: low
    source_id: ../../../plugins/experiment-discipline/skills/experiment-rigor/examples/rg-2x2/record.yaml
  what_each_leg_would_move:
    content_carries: the injected hint moves the evaluation-act disposition while the token-matched inert
      arm does not, so the effect travels with the hint CONTENT rather than with the preamble -- including
      the literal plugin-qualified skill id the router row ships, which is the correct reading of content
      here
    preamble_only: wide and inert both move, so the effect is preamble cost and the content is irrelevant;
      ship no row on this evidence
    inert_moves_alone: inert moves and wide does not, likewise a preamble effect with the content contributing
      nothing; ship no row on this evidence
    recorded_null: 'nothing moves beyond its interval on the clustered scale: a recorded null over a loaded,
      unhinted skill rather than over no treatment, read on the decoy side and on wide - inert'
  posterior:
    belief: 'nothing moves beyond its interval on the clustered scale: a recorded null over a loaded,
