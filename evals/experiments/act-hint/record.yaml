    own cap would cross the ceiling, so the ceiling is never crossed and then noticed. The one-cap margin
    also absorbs a known under-count: the harness retries a transient failure internally and reports only
    the last attempt''s cost, so the accumulator can read low on a retried job.'
  timeout_seconds: 300
  cost_projection_usd:
