      = 0.0 [-0.0623, 0.0623]. A contrast moves when its two-sided interval excludes 0 and its estimate
      reaches the declared MEWD of 0.15. Moved: wide_minus_control=False, inert_minus_control=False, wide_minus_inert=False.'
