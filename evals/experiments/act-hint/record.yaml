  source: hand
  hand_reason: no fathom ledger produces these rows. The detector runs on the in-repo craft harness (evals/harness/claude_runner.py)
    because the outcomes are properties of the response text and the isolation primitives -- one isolated
    credentials-only CLAUDE_CONFIG_DIR for the run set, a fresh spawn per run, a tool allowlist, a --plugin-dir
    -- already exist there; a fathom bank would rebuild them cross-repo. ER-XCHECK's measurement-tier
    WARN is therefore a declared posture, not an accident. run_arms.py appends every run to runs.jsonl,
    which travels with the record as the reconstructible trace.
