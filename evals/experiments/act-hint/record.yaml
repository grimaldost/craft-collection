oracle_validation:
  labeled_set: oracle_labels.json
  sha256: b746067a6c0b02772d9b48cb681babc15b8776f8eb5da665a9852599b20de61c
  n: 16
  languages:
  - en
  - pt
  states_covered:
  - both
  - line_only
  - skeleton_only
  - neither
  per_state_n_min: 3
  positive_class: both
  recall:
    numerator: 4
    denominator: 4
    rate: 1.0
  specificity:
    numerator: 12
    denominator: 12
    rate: 1.0
  adversarial_items: 'four of the sixteen exist to pin a defect found at review rather than to pad a count:
    the PLUGIN-QUALIFIED activation line the injection itself supplies (en-both-03), a SENTENCE-FINAL
    inconsistent figure the earlier fraction pattern dropped (en-skeleton-03), a DATE that must not parse
    as a rate (pt-neither-03), and a line QUOTED inside a fenced block, which is showing the convention
    rather than emitting it (en-neither-02).'
  note: the positive class is the 2x2 state `both` -- the only state that counts a genuine prompt correct,
    and therefore the call the confirmatory outcome rests on. Sixteen labeled items is a small validation
    set and 4/4 recall on it is a weak upper bound, not a claim of perfect sensitivity; its job is to
    catch a pattern edit that changes what the oracle means, which is why every label pins four independent
    calls (line, skeleton, state, wellformedness) rather than one. It measures the oracle against labels,
    not against doctrine -- the systematic false negative on an unlabelled prose check is named under
    threats.construct_validity_proxy, not here.
baseline_expectation:
  control_is_not_no_treatment: every arm loads plugins/experiment-discipline with the Skill tool available,
    and by run time the tier-0 rung and the activation-line emission rule are in that skill's body --
    so the control spawn already carries, in its own loaded plugin, a skill that instructs the behavior
    the oracle scores. Control measures THE SKILL'S OWN TRIGGER SURFACE WITH NO HINT, and wide - control
    is the hint's MARGINAL effect over a loaded, unhinted skill, not "convention versus nothing".
  measured_number: 'the repo holds one number for that surface: the sealed holdout put this skill''s description
    at 0.33 recall [0.15, 0.58] (evals/trigger/holdout/BASELINES.md). It transports POORLY to this bank.
    Four of that holdout''s five positives are pure intent paraphrases, which is the register the lexical
    ceiling predicts near-zero recall on; the single SAME-REGISTER positive -- the direct evaluation-act
    register this bank''s genuine half is deliberately written in, because that is the register the arms''
    patterns must match -- hit 3/3.'
  prior: the genuine-side prior is therefore WIDE RATHER THAN LOW. Control is expected materially above
    zero and the hint's effect is incremental over that; 0.33 is not carried across as a point estimate.
  ceiling_risk: 'the prior''s upper tail is a CEILING RISK, a different failure from the compression named
    below: with control at or near ceiling on the genuine half there is no headroom for any arm to move
    into, and a null then says nothing about the hint. That leg is pre-registered at analysis_plan.interpretations.recorded_null.'
  compression_risk: a non-zero control also COMPRESSES the contrast against a MEWD already declared large.
    That is a spend risk stated up front rather than discovered after the money is gone.
  decoy_side: control near perfect and the treated arms able to lose ground -- the habituation cost the
    wide arm exists to price, and the half the read falls back to if the genuine side is at ceiling.
construct_boundary: this experiment measures the effect of an INJECTED HINT DELIVERED AT ROUTER-REALISTIC
  FIRING PATTERNS. Firing is computed offline by a generator that drives the real router read-only and
  is frozen in firing_table.json; the paid run delivers the frozen text directly, prepended to the prompt
  on stdin. Whether the live UserPromptSubmit hook delivers that same text inside a production spawn is
  NOT measured here. That, and candidate displacement under the live nine-row rules, are named PRECONDITIONS
  for any production rollout of a row -- not results of this run.
