# Finalized by finalize.py -- the frozen pre-registration plus the observed results:
# the disposition and its exclusions, the per-cluster counts and contrasts, the 2x2
# state breakdown, the descriptive tax, the pre-committed interpretation the data
# selected, and the prior -> posterior update. Do not hand-edit; re-run finalize.py
# to regenerate. See FREEZE.md for the choreography.
schema_version: 1.1
tier: measurement
experiment: act-hint-detector
design:
  shared_tasks: true
  cells:
  - name: control_genuine
    planned_n: 24
  - name: control_decoy
    planned_n: 24
  - name: narrow_genuine
    planned_n: 24
  - name: narrow_decoy
    planned_n: 24
  - name: wide_genuine
    planned_n: 24
  - name: wide_decoy
    planned_n: 24
  - name: inert_genuine
    planned_n: 24
  - name: inert_decoy
    planned_n: 24
disposition:
  total: 192
  completed: 189
  excluded: 3
  exclusion_reasons:
    harness_error: 3
    empty_response: 0
    not_run: 0
  excluded_runs:
  - arm: control
    prompt_id: d-pt-06
    repeat: 1
    reason: harness_error
  - arm: narrow
    prompt_id: d-en-06
    repeat: 1
    reason: harness_error
  - arm: narrow
    prompt_id: d-pt-06
    repeat: 0
    reason: harness_error
  note: observed. `harness_error` and `empty_response` are the two arms of the frozen exclusion rule;
    `not_run` counts planned runs the ceiling halt never started, which the ceiling-halt fallback governs
    rather than the exclusion rule. Any non-zero total here puts BOTH outcomes in the contrasts-only shape.
  pairing_rule: every scored run counts; a prompt drops out only where an arm has none
outcomes:
- name: rigor_disposition
  role: confirmatory
  operationalization: the response's 2x2 state under verify.py, which reads the response TEXT and no arm
    label. `line` is the format-(a) activation line present verbatim in shape on a line of its own; `skeleton`
    is all five tier-0 elements present (method, metric, results, conclusion, and the one-line "what this
    updates"), detected by the label patterns in oracle_patterns.json. On a GENUINE evaluation act correct
    means BOTH -- a line emitted without the substance scores zero, which is the founding RG-2x2 declaration-without-behavior
    pattern made measurable rather than rewarded. On a DECOY correct means NEITHER, which prices the cheapest
    way to game the genuine half. The full 2x2 state is recorded per run, so the line-only rate is a first-class
    number.
  verifier:
    path: verify.py
    hash: 68ce9df4a8f578efd18e1f88050c8a6cfd57106bcb8033ce583b0732481c0762
- name: skeleton_wellformedness
  role: exploratory
  operationalization: 'on the GENUINE cells only: at least one numerator-over-denominator figure is present
    in the response AND every such figure is numerically consistent with itself (numerator <= denominator,
    denominator >= 1). This is the weaker, SECONDARY question -- whether the element most often dropped
    actually carries a denominator -- and it is scoped to a subset of the declared cells, so it is reported
    through `clusters` and `contrasts[]` ONLY and carries no `arms` block: ER-RECON holds every arm block''s
    denominators to N_expected, which a subset-scoped outcome cannot satisfy. The enum has no "secondary",
    so the role field reads `exploratory` and this sentence is what says which kind of exploratory it
    is: pre-registered and scoped, not post-hoc.'
  verifier:
    path: verify.py
    hash: 68ce9df4a8f578efd18e1f88050c8a6cfd57106bcb8033ce583b0732481c0762
analysis_plan:
  ci_method: wilson
  contrast_estimator: paired_difference
  unit_of_analysis: the prompt CLUSTER -- 24 of them, 12 within a class -- not the run. Each prompt contributes
    a per-arm rate over its 2 repeats and every contrast is the mean of the per-prompt differences with
    the task-level paired SE from stats.paired_difference. An independent-trials figure over 48 runs per
    arm would price a precision this design does not have.
  comparison: wide vs control on rigor_disposition (primary); wide vs inert (secondary)
  primary_contrast:
    name: wide_minus_control
    outcome: rigor_disposition
    arms:
    - wide
    - control
    role: confirmatory
    question: the deployable-package question. A shipped row ships its tokens too, so the package contrast
      is what a rollout decision would actually rest on.
  secondary_contrast:
    name: wide_minus_inert
    outcome: rigor_disposition
    arms:
    - wide
    - inert
    role: exploratory
    role_note: PRE-REGISTERED AND SCOPED, not post-hoc. The experiment design calls this the confound-separation
      SECONDARY; the role field reads `exploratory` only because the schema's role enum has no "secondary"
      value. It is named here, before the freeze, with its arms and its question fixed, which is the distinction
      the enum cannot carry.
    question: confound separation -- the mechanism question. wide and inert fire on an identical row set
      at an identical insertion point with token-matched text, so this pair is the only one in the design
      that isolates CONTENT from preamble.
  exploratory_contrasts: 'every other contrast is exploratory and is reported as such: narrow_minus_control,
    narrow_minus_inert, inert_minus_control, the per-class decompositions, and anything at all on skeleton_wellformedness.
    Nothing confirmatory may be added after the freeze -- a post-freeze finding is quarantined (added_after_freeze:
    true, role: exploratory), which ER-PREREG enforces against the freeze commit.'
  aa_calibration: 'narrow_minus_wide RESTRICTED TO THE GENUINE HALF is pre-registered here as an A/A calibration,
    exploratory like the rest. The frozen table shows narrow and wide delivering BYTE-IDENTICAL text on
    all 12 genuine prompts -- wide''s extra test/evaluate class adds no genuine match, so on that half
    the two arms are the same treatment run twice. Its expected value is exactly 0, and whatever it does
    show is the instrument''s own noise floor: the smallest difference this design can report without
    a treatment behind it. Reading the primary contrast beside it is free, and a primary effect no larger
    than the A/A spread is not an effect.'
  interval:
    method: paired_t
    alpha: 0.05
    source: stats.paired_interval over the per-cluster deltas
    formula: estimate +/- t(1 - alpha/2, n_clusters - 1) * se, with the t quantile recorded
    status: approximation
    assumptions: roughly symmetric per-cluster deltas and a t reference distribution on few clusters.
      This is the one approximation in the stats module, and naming it beside the exact bound below --
      before the run -- is what stops the friendlier of the two from being chosen afterwards.
  robustness_bound:
    method: sign_test
    sided: two_sided
    status: exact, distribution-free, TWO-SIDED
    reported: beside every contrast's interval, never instead of it
    tie_rule: 'a ZERO per-cluster delta is DROPPED and the surviving effective cluster count is reported
      beside the p-value. Fixed here, before the freeze: with 2 repeats a per-cluster delta lives in {-1,
      -0.5, 0, 0.5, 1} and ties are expected to be the modal cluster, so the effective n is load-bearing
      information rather than a footnote, and picking the rule after seeing the deltas is precisely the
      latitude naming both statistics is meant to remove.'
  per_arm_intervals:
    method: wilson
    role: descriptive
    note: an UPPER BOUND on precision -- it prices independent trials on a design whose unit is the prompt
      cluster. Stated only for the full-cell-set confirmatory outcome, and only when disposition.excluded
      is 0 (see exclusions.arms_block_rule). The headline precision is always quoted on the clustered
      scale.
  decision_rule:
    metric: rate_difference
    comparison: gte
    threshold: 0.15
    direction: two_sided
  decision_rule_note: 'TWO-SIDED on the genuine half. The corrected control prior no longer licenses a
    directional bet, and a treated arm can land BELOW control if the injected hint displaces the model''s
    own dispatch -- a behavioral claim that stands on its own. The decoy half is two-sided as before:
    control near perfect and treated arms able to lose ground, which is the habituation cost the wide
    arm exists to price. The threshold is the honest MEWD on the clustered scale: a plausible two-sided
    half-width is about 0.15 pooled over 24 clusters and about 0.20 within a class of 12, and a difference
    of differences is wider still.'
  interpretations:
  - id: content_carries
    condition: wide moves beyond its interval and inert does not
    read: 'the hint''s CONTENT carries the effect. "Content" here means the REALISTIC hint, not disembodied
      semantics: the wide text is the router''s own composition, so its content includes the literal plugin-qualified
      skill id `experiment-discipline:experiment-rigor`, the echoed matched words from the prompt, and
      the imperative to check fit before starting. A model that reacts to the named id rather than to
      the sentence''s meaning selects this leg too, and that is the correct reading of it -- a shipped
      row ships the id.'
  - id: preamble_only
    condition: wide and inert both move alike
    read: the effect is preamble cost and the content is irrelevant; ship no row on this evidence
  - id: inert_moves_alone
    condition: inert moves and wide does not
    read: likewise a preamble effect with content contributing nothing; ship no row
  - id: recorded_null
    condition: nothing moves beyond its interval
    read: a recorded null. A null with control AT OR NEAR CEILING on the genuine half is recorded as NO
      HEADROOM, not as no effect -- the instrument had nowhere to move, which is a different finding and
      a different follow-up. The read then rests on the DECOY side, where the habituation cost is visible
      whatever the genuine ceiling does, and on wide - inert.
  exclusions:
    rule: a refusal, a truncation, or a tool error is excluded with its reason through the disposition
      machinery, and the response text of an excluded run is not scored.
    operationalization: 'a run is excluded IFF the harness reports is_error or the response text is empty;
      a response that DECLINES for lack of an allowed tool is NOT an exclusion -- it is scored as written.
      This is load-bearing rather than housekeeping: 10 of the 12 decoys ask for actions the arms cannot
      perform (Bash, Write and Edit are all denied), so without this line the refusal-versus-response
      judgement would decide after the fact whether the decoy half exists at all. A spawn that says it
      cannot run the suite, and stops, has still answered without the shape, which is exactly what a decoy
      is scored on.'
    fully_excluded_prompt: a prompt whose runs are ALL excluded in either arm of a contrast drops out
      of that contrast entirely, with the surviving cluster count recorded. stats.paired_difference raises
      on a zero-size cluster rather than degrading, so the drop-out rule is what keeps one dead prompt
      from taking the analysis down.
    arms_block_rule: 'OBSERVED PRE-SPEND against the real validator and pre-registered here rather than
      discovered at finalize: ER-RECON holds every outcome''s arm denominators to sum to N_expected (192),
      so a record stating per-arm counts alongside a non-zero disposition.excluded cannot reconcile. The
      rule is therefore fixed now -- the confirmatory outcome states its `arms` block only when disposition.excluded
      is 0. With any exclusion BOTH outcomes are reported contrasts-only over the surviving clusters and
      the descriptive per-arm Wilson rates, which an exclusion is the first thing to invalidate, are not
      stated at all.'
  ceiling_halt_fallback: if the 75 USD ceiling halts the run, the pre-registered fallback analyzes COMPLETE
    PROMPT-PAIRS only -- a prompt is kept only where every arm of the contrast carries both of its repeats
    -- and the reduced precision is reported on the clustered scale.
  language_fallback: 'decided from the FROZEN FIRING TABLE, which holds no outcome data, so reading it
    before the run is a design decision and not a peek at a result: if the table shows the PT-BR firing
    rate below half the EN rate, the primary analysis restricts to the EN half. Observed in the frozen
    table -- narrow fires 6/12 EN and 6/12 PT-BR, wide 9/12 and 9/12. The rates are equal, so the fallback
    does NOT fire and the primary analysis runs over all 24 prompts.'
threats:
  contamination_familiarity:
    status: residual
    statement: the tier-0 shape is a plain five-element report structure and models may have seen structurally
      similar shapes in pretraining. That is not removable here, and it is partly what the control arm
      measures rather than a confound to subtract.
  prompt_format_sensitivity:
    status: controlled
    statement: one bank, one prompt text per id across every arm, one insertion point (the injected text,
      a blank line, then the prompt, fed on stdin). The only thing that varies between arms is which prompts
      receive an injection and what text they receive.
  judge_bias:
    status: controlled
    statement: verify.py alone scores the runs -- a deterministic regex oracle, frozen by SHA, carrying
      no arm label, validated against a 12-item hand-labeled set spanning both languages and all four
      2x2 states before use (recall 3/3, specificity 9/9 on the `both` state). No LLM judge exists in
      this design, so no judging line item appears in the cost.
  model_version_drift:
    status: residual
    statement: one unpinned model snapshot (claude-sonnet-4-6) over the measurement window; the instrument
      can move underneath the run. Arm order is randomized and interleaved under seed 20260725, so a drifting
      snapshot cannot line up with an arm -- that bounds the damage, it does not remove it.
  nondeterminism:
    status: residual
    statement: CLI default sampling (no temperature flag is passed, so it is above zero) with 2 repeats
      per cell. Two repeats is also what puts a per-cluster delta in {-1, -0.5, 0, 0.5, 1} and makes ties
      the expected modal cluster, which the sign test's tie rule is fixed in advance for.
  construct_validity_proxy:
    status: residual
    statement: 'the oracle scores the SHAPE of the response, which is a proxy for the discipline the shape
      is meant to carry, and it errs in both directions. FALSE POSITIVE: a five-element wrapper around
      an unconsidered answer scores correct; skeleton_wellformedness is the partial answer (a denominator
      present and self-consistent) and it is a secondary, not the headline. FALSE NEGATIVE, and the more
      likely of the two: the oracle detects the five elements by their LABELS, so it scores the reference''s
      worked-example format rather than the rung''s actual rule -- and the reference says explicitly that
      "a check that carries all five in two sentences is a good check" and that the point is that every
      element is answerable, not that the response has five headings. A fully doctrine-compliant unlabelled
      prose check therefore scores 0 of 5. The consequence is stated rather than repaired: absolute rates
      read LOW and must not be quoted as the rate at which the discipline was followed, while the CONTRASTS
      stay interpretable because the mode is arm-uniform -- nothing in any arm''s injected text touches
      labelling. The one arm-differential interaction this had, an inert text that discouraged the labelled
      shape, was removed from the clause pool before the freeze.'
  token_length_confound:
    status: residual
    statement: 'written per contrast, not blanket. The token-matched inert arm controls it for `wide -
      inert` ONLY: every firing row''s inert text matches wide''s estimated token count exactly in the
      frozen table (0.00 percent deviation on all 18 firing rows, against a 5 percent tolerance). NO arm
      is length-matched to narrow, so `narrow - control` re-inherits the founding RG-2x2 case''s confound
      intact. And the package contrasts -- `wide - control` and `narrow - control` -- make NO mechanism
      claim: they price a deployable row, tokens included.'
  selection_exclusion:
    status: residual
    statement: no run has happened, so no exclusion is observed. The exclusion rules are pre-registered
      in analysis_plan.exclusions (reason-tagged exclusion, the fully-excluded-prompt drop-out, and the
      arms-block rule); the finalize step restates this row against the observed disposition.
  generalization:
    status: residual
    statement: 'one bank of 24 prompts in two languages, one model, one turn cap, one insertion point,
      one plugin loaded. And the construct boundary carried throughout: this measures THE EFFECT OF AN
      INJECTED HINT DELIVERED AT ROUTER-REALISTIC FIRING PATTERNS. Whether the live UserPromptSubmit hook
      delivers that same text inside a production spawn is NOT measured here -- it is a named precondition
      for any production rollout of a row.'
  custom_oracle_primeability:
    status: controlled
    statement: 'CONTROLLED MECHANICALLY: a test runs the oracle''s own activation-line and five-element
      patterns over every bank prompt AND every frozen injected text, so the treatment cannot hand the
      model the answer the oracle scores. The constraint binds the bank as well as the rules because the
      router echoes literal spans of the prompt into the hint. The RESIDUAL is that a ban list can only
      cover the prime paths it names: the two primeability-class defects found at review -- the oracle
      rejecting the plugin-qualified id the injection itself supplies (an arm-differential FALSE negative,
      since only the treated arms carry the id) and a quoted-in-a-fence line scoring as an emitted one
      -- were both missed by this test, because neither was a banned string appearing where it should
      not be. Both are fixed in the frozen oracle; the class is not closed by fixing two of its members,
      so this row stays visible rather than being retired.'
  custom_candidate_displacement:
    status: residual
    statement: 'the offline firing table exhibits NO displacement, and the reason is structural rather
      than reassuring: each arm''s rules file carries the evaluation-act row ALONE, so route() can return
      at most one candidate and there is nothing to crowd out. Displacement under the live nine-row router_rules.json
      is therefore UNMEASURED, and it stands -- together with live-hook delivery -- as a production precondition
      rather than as a result of this run. It is also why the genuine-side decision rule is two-sided:
      a hint can displace the model''s own dispatch, which is a behavioral claim that does not depend
      on the router''s row competition at all.'
  custom_language_delivery:
    status: residual
    statement: the PT-BR patterns are UNCALIBRATED -- authored for this bank, not fitted against a labeled
      PT-BR set -- and the router's ASCII collapse rewrites an accented echoed span, so 2 of the 6 PT-BR
      genuine rows deliver "isso ? eficaz" / "qual ? melhor" where the EN rows deliver clean text. The
      PT-BR half therefore receives a slightly degraded hint. The pre-registered fallback (analysis_plan.language_fallback)
      restricts the primary analysis to EN if the frozen table shows PT-BR firing below half the EN rate;
      the frozen table shows the rates EQUAL, so the fallback does not fire and all 24 prompts stay in.
