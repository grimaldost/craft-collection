  n_planned: 192
  last_run_at: '2026-07-26T12:44:30Z'
  n: 192
  cost_usd_est: 17.8702
run_config:
  runner: evals/experiments/act-hint/run_arms.py over evals/harness/claude_runner.py
  model: claude-sonnet-4-6
  model_rationale: the repo's standard agent model (evals/config.json `agent_model`). The only in-repo
    cost anchor is a trigger-arm run at about 0.099 USD per read-only 3-turn spawn on this same model
    -- a LOWER BOUND on a different profile, not a like-for-like rate, because the detector's spawns are
    task-shaped. Budgeting 0.13-0.31 USD per run at a turn cap of 6 puts the estimate at 24.96-59.52 USD,
    inside the declared 25-60 band and under the 75 USD ceiling.
  sampling_mode: cli_default
  sampling: CLI default -- no temperature or top-p flag is passed, so sampling is above zero
  max_turns: 6
  repeats: 2
  insertion_point: prefix_blank_line
  insertion_note: the frozen injected text, one blank line, then the bank prompt, delivered on the spawn's
    stdin. One insertion point, never moved, identical across arms.
  plugin_dir: plugins/experiment-discipline
  allowed_tools: Skill,Read,Glob,Grep
  skill_tool_in_allowlist: true
  allowlist_identical_across_arms: true
  disallowed_tools: Write,Edit,NotebookEdit,Bash,WebFetch,WebSearch,Task
  cwd_fixture: evals/experiments/act-hint/cwd_fixture
  isolation: 'ONE isolated credentials-only CLAUDE_CONFIG_DIR is built for the run set (no CLAUDE.md,
    no settings.json, no history) and every spawn uses it; it carries no per-run state, so sharing it
    across the set is not a channel between runs. PER RUN: a fresh spawn under --no-session-persistence,
    the restricted allowlist above, and the neutral cwd fixture holding no expected answer. No state carries
    between repeats, and the config dir is identical for every arm.'
  order_seed: 20260725
  order: randomized and interleaved across arms under random.Random(seed).shuffle
  per_run_budget_usd: 0.4
  ceiling_usd: 75.0
