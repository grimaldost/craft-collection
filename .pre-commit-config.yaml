# Pre-commit quality gates for craft-collection.
#   Enable:   uv tool run pre-commit install
#   Run now:  uv tool run pre-commit run --all-files
# Versions are pinned to match the python-engineering skill's house standard.
minimum_pre_commit_version: '3.5.0'
default_install_hook_types: [pre-commit, pre-push]
# Pin the hook interpreter to the 3.13 baseline CONTRIBUTING names for CI and uv.
# Without this the local interpreter floats to whatever `python` resolves to, which
# silently drifted these hooks onto 3.14 and rebuilt their venv shims.
default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]   # keep intentional Markdown line breaks
      - id: end-of-file-fixer
      - id: check-json                          # marketplace.json, plugin.json, hooks.json, eval data
      - id: check-yaml                          # workflows + this config
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff                                # lint (autofix)
        args: [--fix]
      - id: ruff-format                         # format to ruff.toml (100-col, single quotes)

  - repo: local
    hooks:
      - id: lint-register
        name: register linter (humblepowers doctrine)
        entry: uv run --no-project -- python scripts/lint_register.py
        language: system
        pass_filenames: false
        always_run: true
      - id: agents-md-fresh
        name: AGENTS.md freshness (generated index, never hand-edited)
        entry: uv run --no-project -- python scripts/gen_agents_md.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: check-gate-claims
        name: documented env-gate defaults match their guards
        entry: uv run --no-project -- python scripts/check_gate_claims.py
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-plugins
        name: validate marketplace structure
        entry: uv run --no-project --with pyyaml -- python scripts/validate_plugins.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ascii-runtime-lint
        name: ascii runtime output (ratchet against baseline)
        entry: uv run --no-project -- python scripts/ascii_runtime_lint.py
        language: system
        pass_filenames: false
        always_run: true
      - id: experiment-rigor-validate
        name: experiment-rigor record validator (travelling records)
        entry: uv run --no-project --with pyyaml -- python plugins/experiment-discipline/skills/experiment-rigor/scripts/validate.py
        language: system
        # Deliberately diverges from the always_run convention above (FM-6 / Q6): a
        # files: regex plus pass_filenames selects only staged, tracked record.yaml
        # paths, so gitignored docs/design/** records never reach the gate.
        files: ^(plugins/experiment-discipline/skills/experiment-rigor/examples/.*/record\.yaml|evals/.*/record\.yaml)$
        pass_filenames: true
      - id: experiment-rigor-render-check
        name: experiment-rigor report drift gate (record.yaml <-> report.md)
        entry: uv run --no-project --with pyyaml -- python plugins/experiment-discipline/skills/experiment-rigor/scripts/render.py --check
        language: system
        # Same FM-6 / Q6 divergence as the validator hook: a files: regex plus
        # pass_filenames selects only staged, tracked travelling paths. The regex
        # matches BOTH members of the pair -- record.yaml AND report.md -- so a staged
        # report.md with an unrestaged record still reaches the gate (F3); render.py
        # --check resolves either member to the pair. Gitignored docs/design/** records
        # never reach the gate.
        files: ^(plugins/experiment-discipline/skills/experiment-rigor/examples/.*/(record\.yaml|report\.md)|evals/.*/(record\.yaml|report\.md))$
        pass_filenames: true
      - id: run-tests
        name: run self-contained test suite
        # --with pyyaml: the experiment-rigor record-parsing suites (validate, render,
        # from_fathom, schema) hard-fail without PyYAML rather than skip, so the runner
        # must provide it or the pre-push gate goes red (FM-2 wave change).
        entry: uv run --no-project --with pyyaml -- python scripts/run_tests.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]                      # keep commits fast; gate before push
