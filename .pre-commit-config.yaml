# Pre-commit quality gates for craft-collection.
#   Enable:   railform arm (or: git config core.hooksPath .githooks), once per clone; the
#             tracked wrappers in .githooks/ run this file through a pinned pre-commit
#   Run now:  uvx --from pre-commit==4.6.2 python -m pre_commit run --all-files
# The two entries between the railform markers are written by `railform adopt` and checked
# by `railform adopt --check`; everything else here is this repository's own.
# Versions are pinned to match the python-engineering skill's house standard.
minimum_pre_commit_version: '3.5.0'
default_install_hook_types: [pre-commit, pre-push, commit-msg]
# Hooks that name no stages: run at pre-commit and pre-push only. Without this,
# installing the commit-msg lane re-fires every always_run repo gate a second
# time per commit, at the commit-msg stage.
default_stages: [pre-commit, pre-push]
# No default_language_version: railform's CI replays the hygiene hooks with a pre-commit
# running on the runner's own Python and sets up no 3.13, so a `python3.13` pin would leave
# those hooks without an interpreter. Hook environments use the Python pre-commit runs on.

repos:
  # >>> railform: owned by `railform adopt`; `railform adopt --check` fails on any edit
  - repo: https://github.com/grimaldost/railform
    rev: 65bf54ae6f4ed7bd027fee9e0806d9dfa2df3c48
    hooks:
      - id: railform-commit-msg
      - id: railform-branch-name
      - id: railform-hooks-check
        files: '^\.githooks/'
      - id: railform-private-refs
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-merge-conflict
        args: [--assume-in-merge]
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
  # <<< railform
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff                                # lint (autofix)
        args: [--fix]
      - id: ruff-format                         # format to ruff.toml (100-col, single quotes)

  # Commit-msg lane: railform-commit-msg (above) holds the Conventional Commits subject rule
  # and the attribution patterns. At the release pin its stamp arm also names GPT and Anthropic
  # anywhere later on the line, so no-ai-attribution below no longer catches anything the
  # railform hook misses; it is kept until its retirement is decided (see the pull request).
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: reject AI attribution in commit messages
        entry: uv run --no-project -- python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
      - id: lint-register
        name: register linter (humblepowers doctrine)
        entry: uv run --no-project -- python scripts/lint_register.py
        language: system
        pass_filenames: false
        always_run: true
      - id: agents-md-fresh
        name: AGENTS.md freshness (generated index, never hand-edited)
        entry: uv run --no-project -- python scripts/gen_agents_md.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: check-gate-claims
        name: documented env-gate defaults match their guards
        entry: uv run --no-project -- python scripts/check_gate_claims.py
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-plugins
        name: validate marketplace structure
        entry: uv run --no-project --with pyyaml -- python scripts/validate_plugins.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ascii-runtime-lint
        name: ascii runtime output (ratchet against baseline)
        entry: uv run --no-project -- python scripts/ascii_runtime_lint.py
        language: system
        pass_filenames: false
        always_run: true
      - id: subprocess-encoding-lint
        name: subprocess text mode names its encoding (ratchet against baseline)
        entry: uv run --no-project -- python scripts/subprocess_encoding_lint.py
        language: system
        pass_filenames: false
        always_run: true
      - id: experiment-rigor-validate
        name: experiment-rigor record validator (travelling records)
        entry: uv run --no-project --with pyyaml -- python plugins/experiment-discipline/skills/experiment-rigor/scripts/validate.py
        language: system
        # Deliberately diverges from the always_run convention above (FM-6 / Q6): a
        # files: regex plus pass_filenames selects only staged, tracked record.yaml
        # paths, so gitignored docs/design/** records never reach the gate.
        files: ^(plugins/experiment-discipline/skills/experiment-rigor/examples/.*/record\.yaml|evals/.*/record\.yaml)$
        pass_filenames: true
      - id: experiment-rigor-render-check
        name: experiment-rigor report drift gate (record.yaml <-> report.md)
        entry: uv run --no-project --with pyyaml -- python plugins/experiment-discipline/skills/experiment-rigor/scripts/render.py --check
        language: system
        # Same FM-6 / Q6 divergence as the validator hook: a files: regex plus
        # pass_filenames selects only staged, tracked travelling paths. The regex
        # matches BOTH members of the pair -- record.yaml AND report.md -- so a staged
        # report.md with an unrestaged record still reaches the gate (F3); render.py
        # --check resolves either member to the pair. Gitignored docs/design/** records
        # never reach the gate.
        files: ^(plugins/experiment-discipline/skills/experiment-rigor/examples/.*/(record\.yaml|report\.md)|evals/.*/(record\.yaml|report\.md))$
        pass_filenames: true
      - id: run-tests
        name: run self-contained test suite
        # --with pyyaml: the experiment-rigor record-parsing suites (validate, render,
        # from_fathom, schema) hard-fail without PyYAML rather than skip, so the runner
        # must provide it or the pre-push gate goes red (FM-2 wave change).
        entry: uv run --no-project --with pyyaml -- python scripts/run_tests.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]                      # keep commits fast; gate before push
