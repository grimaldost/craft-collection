# Written by railform adopt: runs railform release-check on every tag push, every day and on
# demand. railform adopt --check fails on any edit; railform adopt --pin moves the pin.
name: railform-tag-watch
on:
  push:
    tags: ['**']
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-check:
    uses: grimaldost/railform/.github/workflows/tag-watch.yml@3e6f27f8970700c5166b908fae65572c431b2571
    permissions:
      contents: read
      pull-requests: read
    with:
      railform-sha: 3e6f27f8970700c5166b908fae65572c431b2571
