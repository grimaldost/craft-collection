# Written by railform adopt: runs railform release-check on every tag push, every day and on
# demand. railform adopt --check fails on any edit; railform adopt --pin moves the pin.
name: railform-tag-watch
on:
  push:
    tags: ['**']
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-check:
    uses: grimaldost/railform/.github/workflows/tag-watch.yml@300d175b50b62a9844b480ada55435ede5ca38ab
    permissions:
      contents: read
      pull-requests: read
    with:
      railform-sha: 300d175b50b62a9844b480ada55435ede5ca38ab
