name: validate

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the experiment-rigor freeze gates reconstruct a frozen
          # pre-registration with `git show <freeze commit>:<path>`, and the RG-2x2
          # acceptance suite fails LOUD (never skips) when that object is absent. A
          # depth-1 clone is expected to fail it; the fix is depth, not a skip.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install tooling
        run: pip install pyyaml ruff==0.15.7
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Register linter (humblepowers doctrine)
        run: python scripts/lint_register.py
      - name: Validate plugins (structural)
        run: python scripts/validate_plugins.py
      - name: AGENTS.md freshness (derived-artifact integrity, ADR-0001)
        run: python scripts/gen_agents_md.py --check
      - name: Env-gate claims match their guards
        run: python scripts/check_gate_claims.py
      - name: Release discipline (a plugin-touching PR bumps and logs, or declares)
        # PR-only: the check reads the merge-base diff against the PR's base
        # branch; a push to main has no base to diff against.
        if: github.event_name == 'pull_request'
        run: python scripts/check_release_discipline.py --base "origin/${{ github.base_ref }}"
      - name: Run tests
        run: python scripts/run_tests.py
