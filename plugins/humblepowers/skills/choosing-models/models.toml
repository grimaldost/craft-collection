# Single source of truth for the choosing-models tier data. The SKILL.md and
# rubric cite this file instead of hardcoding lineup or thresholds in prose;
# /refresh-models updates it (mechanical lineup changes on approval; threshold
# changes only with calibration evidence).
#
# Deliberately thin: NO sticker prices here — the platform's model reference
# (e.g. the claude-api skill) is the price source, read at the point of use.
# Duplicating prices would create one more unowned mirror.
#
# Project override chain: a project-level copy of this file (project skill dir
# or a method binding) wins over the plugin's copy. Calibration is
# distribution-relative — project-specific corrections land in the override,
# not here.

schema_version = '1'

[meta]
last_reviewed = "2026-09-26"   # stamped by /refresh-models; mirrored nowhere else
review_by = "2026-12-26"       # age tripwire — past this date, refresh before trusting
calibration = "model-tier calibration runs of 2026-06-16, 2026-07-01 and 2026-08-11 (fathom model-tier-v1; the last is 5 arms x 7 tasks x 5 repeats, adding claude-opus-5). Thresholds are still ported defaults, and the 2026-08-11 decision was to change neither them nor the scoring mechanics: the bank has no power to move a cut. On-diagonal is 1/7 in all three runs, but 6 of 7 tasks sit at 100% for every arm, no task resolves empirically to mid or strong, and a 10/10 cell carries a Wilson 95% CI of [0.72, 1.00] - so a null here is manufactured by saturation, not observed. The tier-separating bank that would have the power (fathom docs/specs/2026-07-14-tier-separating-bank-design.md) has since run in part - see deciding_context below. Its positive control separates (haiku 1/10 against opus5 10/10, one-sided Fisher p = 5.95e-05), so that bank's readings are interpretable where v1's were not; the census that would re-ask whether the score separates tiers on outcome was priced and not bought. Observed direction, recorded not acted on: over-provisioning persists - 5 of 7 tasks were served by the weak tier, and the newest strong model was quality-flat against its predecessor at ~1.4x the per-task cost (Opus 5 against Opus 4.8; Opus 5.5 has not been calibrated)."
oracle_discount = "Labeled hypothesis, pending the crossed model x oracle-quality calibration in the same unrun bank. Established: a suite-only gate at the weak tier neither detects nor lifts (gates green, escapes reach the oracle), so gate value tracks the independence and coverage of the checks; and, twice over, scored tiers over-provision in the small while an iterative implement-gate-fix loop beat a bigger one-shot model on feature-refactor shapes. New 2026-08-11 (fathom model-tier-v1, n=30/arm, directional): the executing model authored a regression test in 70% of trials where four other models did so in 0-3%, so the oracle a task will have is partly a function of which model runs it - which is why the discount asks what oracle will exist for this run, not what exists now. New 2026-08-12 (fathom model-tier-v2, 89 trials over the positive control and the four discordant briefs): 63 passes, 26 failures, 0 caught by the shipped suite, 26 silent. `gate_caught` there means a hard criterion false AND a harness-side copy of the fixture's own suite red, so a candidate deleting a test cannot convert a caught failure into a silent one - it is the conservative reading, not a generous one. The bank is enriched for displaced-cause shapes, where the fix site sits outside what the shipped suite covers, and that is the point: on exactly the shapes the rubric's cross-shape floor fires on, the shipped suite is not the oracle the discount asks for, so a discount presuming the failure will be caught buys nothing. A property of those task shapes rather than of any routing policy - a bank of covered-cause tasks would read differently - and the reason the SKILL body now asks whether a gate sees the failure at all, not only whether it can diagnose it. New 2026-09-03, the first measured point against this hypothesis (bank multiagent-composition-v2; a Sonnet 5 orchestrator dispatching one implementer subagent per PR in every arm; endpoint held_out_clean, all six held-out checks pass; n = 16 per arm, a voided trial dropped and its re-run kept): weak-tier implementers under a per-PR independent gate (config_hash 686bf6f6025f) 16/16, Wilson 95% [0.81, 1.00]; mid-tier implementers on the project's own suite alone (config_hash 2b3f299c1f4f) 2/16, [0.03, 0.36]; mid with the gate reached 14/16. Caveat: one bank, one task shape, one defect class, and on bank v1, whose prompts spelled the rule out, the effect vanished (every cell clean, 3/3 in all eight), so it needs a brief that leaves the implementer something to infer. The test that decides it: the tier x oracle crossing on iteration 2's harder bank, which adds a second defect class with headroom; not yet run."
deciding_context = "2026-08-12, fathom routing-decision-v1 (54 trials, $14.04) read beside model-tier-v2's control and discordant slice (89 trials, $27.60). The first measurement of what TAKING the routing decision costs; three prior calibration cycles asked only whether the score predicts the right tier. Rubric premium per task over deciding unaided: $0.0021 at the weak deciding tier over a batch of nine, $0.0748 at mid deciding one task, $0.2026 at strong deciding one task - two orders of magnitude, driven by where the decision is taken and how many tasks it covers rather than by what the rubric says. Agreement with the same session's unaided choice (modal route over 3 repeats, 9 briefs): 9/9 at strong, 8/9 at mid, 5/9 at weak. So at the strong deciding tier on one task the rubric changes nothing and costs the most - break-even 77.6% / 93.8% / 104.7% at a weak-tier pass rate of 1.0 / 0.8 / 0.7, and above 100% it cannot pay at any correction rate. At mid on one task the bar is 28.6-38.6% against one disagreement in nine (11%) as the ceiling. LICENSED AND SHIPPED: the deciding-context rule in SKILL.md - skip the rubric at a capable decider on a single task, score batches at the weak tier, check an emitted tier against the thresholds. NOT LICENSED, and not done: (1) no threshold moved - the only robust adequacy readings in the wave are fix-decimal-round's weak and mid arms, and the pre-registration requires robust readings plus the playbook's cross-distribution rule; (2) the points system stays - of the two escalations off mid that proved unnecessary, only fix-ledger-replay implicates the formula (score 71 said strong, weak sufficed), while on refactor-dedupe-validators the formula said mid at score 45 and a weak model APPLYING it emitted strong, which is a decider error and not a design error; (3) no general over-provisioning claim - the four discordant briefs split 2-2 by tier pair, right to escalate off weak and wrong off mid. Nor is the direction of error uniform: every disagreement in the routing programme was the rubric routing UP, which reads as conservative bias, but on fix-decimal-round (weak 0/5, mid 0/5, strong 5/5, a robust reading) the rubric escalated in the right direction and UNDER-escalated - routing by it would still have shipped a silent failure, and that is not scored as a rubric win. HELD OPEN: whether the rubric routes BETTER anywhere was never measured; the weak decider's four upgrades cost +$0.0580/task in extra execution, 28x its own decision premium, and only 2 of 4 were shown necessary; feature-ndjson-merge sits at 0.62 against the 0.70 bar and needs n~200 on one arm to resolve, so it is permanently borderline at buyable n; and presentation moves the route - 6 of 9 arms routed the one shared brief differently alone than inside a batch of nine, mechanism-independently - so batch and per-spawn routing are not interchangeable (n=3 on one brief, recorded not leaned on); and the decision premiums above were measured at weak, mid and strong deciders only - there is no frontier arm, while the sessions that most often take this decision today run at the frontier tier (2026-09-04 workflow runs on Fable 5.1), so the skip-the-rubric rule reaches them by extrapolation, not by measurement."

effort_observations = "Fix rounds by effort, six tasks from the 2026-09-20 routing-outcome reports (two lots of one programme). Task, score, routed tier/effort, fix rounds, and whether its correctness was agreement between two independent statements of one rule - A: 50, sonnet/medium, 2 rounds, not classed by the report (a stale mirror among its major findings); B: 73, opus/medium, 3 rounds, yes (two readers of one domain rule); C: 88, opus/high, 1 round, yes; D1: 60, opus/medium, 0 rounds, no; D2: 96, opus/high, 1 round, yes (vectorised and scalar paths); PR-G: small diff, sonnet/medium, 2 rounds, yes (pins and docstring promises). Reading: the tasks carrying the agreement obligation took 2-3 rounds at medium effort on both tiers (B, PR-G) and 1 round at high (C, D2); the one task without it took none at medium (D1); A fits if its mirror counts. Effort is the variable the data isolates, tier varied among the medium cases, and the scoring rubric cannot reach these tasks (its parity floor needs an unnamed implementation and raises a score only to the bottom of mid). Directional addition from the 2026-09-28 routing report, no round count: keeping a concordance test green against a mirror one lot behind was handled by the strong tier, and a mid tier might not have. Six tasks, one programme: observations behind the agreement qualifier in references/emission-and-effort.md, not a calibrated threshold."
verifier_observations = "Strong-tier verifiers and challengers handed the finder's evidence act as second finders, not only as false-positive filters: they found defects the finders missed and corrected overstated and confounded claims. 2026-10-06-homelab-health-audit-choosing-models-humblepowers#1: opus/high verifiers over 8 auditors (5 opus, 3 sonnet) and 4 sonnet gap checkers found 2 defects the auditors missed, both committed, and refuted or downgraded 4 mid-tier overstatements. 2026-10-06-homelab-audit-followups-choosing-models-humblepowers#1: an opus/high challenger separated a confounded cause in a strong-tier investigator's diagnosis; the trim it prescribed took the run from 810 s to 565 s on its own, and the investigator's recommended change bought nothing. 2026-10-06-fathom-split-cleanup-choosing-models-humblepowers: §Misses bullet 1, a task scored 54 and run at mid put a factual error into public text and the stakes-routed Opus reviewer caught it; §What worked, the Opus reviewers on the three public diffs found the batch's only 2 substantive defects. 2026-09-26-homelab-deadman-probe-choosing-models §What worked: two opus/high lenses independently found the same real defect, upheld by two opus refuters. The 2026-09-20 routing-outcome reports: every MAJOR in a five-PR chain came from a fresh opus/high verifier and none from the gate battery, and blind opus/high verifiers found all 16 MAJOR defects of the day with every battery green; a 2026-09-21 routing report: a fixed blind opus/high verifier found every MAJOR with the battery green. Evidence for keeping verify and challenge roles at strong whatever tier the finder runs at; not a threshold or tier change."

lineup_reconciled = "2026-08-11 against the platform model reference: strong was pinned to a model the machines are no longer served. Direction settled before any mirror walk - the sibling PRICE mirrors are keyed by family substring (opus/sonnet/haiku/fable), so a model-id change inside a family does not touch them and they were correct on that date; the one sibling tier-to-model map carried the same stale strong entry, so the walk propagates a corrected lineup rather than a stale one. 2026-09-05: frontier moved claude-fable-5 -> claude-fable-5-1 (same tier, same price; Fable 5 is legacy but still served). And the family-key argument above protects against an ID change only: both sibling price tables still carried Sonnet 4.6's $3/$15 while the mid tier had run claude-sonnet-5 at $2/$10 since 2026-08-11, so every mid-tier estimate was 50% high for three weeks. A price row is a mirror the walk has to check, not one the family key protects. 2026-09-26: strong moved claude-opus-5 -> claude-opus-5-5, a lineup-only change - the successor in the same line, at a LOWER price ($4/$20 against $5/$25), so the tier's cost only falls and no threshold moves (none may on a release note). The harness aliases were measured the same day by asking a spawned agent for the model id its system prompt names: opus -> claude-opus-5-5, sonnet -> claude-sonnet-5, haiku -> claude-haiku-4-5-20251001, fable -> claude-fable-5-1. So every strong-tier spawn had already been running Opus 5.5 while this row still said Opus 5: the alias follows the harness, not this file, and this file is what a direct-API or series-file author reads. The family-keyed price tables now meet a family with two live prices (Opus 5 and 4.8 at $5/$25, Opus 5.5 at $4/$20); a fallback keyed by family over-estimates an Opus 5.5 run by 25%."

# Score -> tier. Calibratable data, not doctrine: the rubric owns how to
# score, these bands own where the cuts sit. frontier is opt-in only and
# never score-assigned (criteria in SKILL.md).
[thresholds]
weak = "0-25"
mid = "26-55"
strong = "56-100"

[[models]]
tier = 'weak'
api_string = 'claude-haiku-4-5'   # undated alias, never a dated snapshot
harness_alias = 'haiku'           # Agent tool / workflow agent() vocabulary
display = 'Haiku 4.5'
available = true
notes = 'the effort flag is accepted and ignored, not rejected (measured 2026-09-13 on the CLI, `claude -p --model claude-haiku-4-5 --effort low` exits 0, and on two governed spawns at effort=low, both exit 0; other surfaces unmeasured); 200K context window vs 1M on the other three tiers; the harness alias resolves to the dated snapshot claude-haiku-4-5-20251001 (measured 2026-09-26)'

[[models]]
tier = 'mid'
api_string = 'claude-sonnet-5'
harness_alias = 'sonnet'
display = 'Sonnet 5'
available = true
notes = '$2/$10 confirmed permanent on 2026-08-31 (dated note on the platform pricing page; the intro window closed that day); tokenizer ~30% more tokens for the same text vs Sonnet 4.6 — cheaper per token is not cheaper per task'

[[models]]
tier = 'strong'
api_string = 'claude-opus-5-5'
harness_alias = 'opus'
display = 'Opus 5.5'
available = true
notes = '20% cheaper per token than Opus 5 (prices: the platform reference); marked launching in that reference on 2026-09-26, whose own default is still claude-opus-5 - the harness alias already serves it; platform default effort is `medium`, one level below Opus 5, so a direct-API or series-file request that omits effort runs lower; thinking cannot be disabled at any effort (400); forced tool_choice any/tool returns 400; supersedes claude-opus-5 (still served, same line)'

[[models]]
tier = 'frontier'
api_string = 'claude-fable-5-1'
harness_alias = 'fable'
display = 'Fable 5.1'
available = true
notes = '2.5x Opus 5.5 pricing; opt-in only — never score-assigned; supersedes claude-fable-5 (legacy, still served, same tier and price)'

# Per-task cost observations from calibration/production runs — provenance
# above. Small-prompt baselines; a large prompt at max effort runs 5-10x.
# These are observations for batch-table estimates, not sticker math. Cheaper
# is also not faster wall-clock — the caveat that keeps getting re-learned,
# held here with the other two rather than restated in the skill body.
[typical_cost]
weak = "$0.01 small-prompt baseline"
mid = "$0.06 small-prompt baseline"
strong = "$0.15 small-prompt baseline (observed on Opus 5; Opus 5.5 is 20% cheaper per token and unmeasured per task)"
frontier = "$0.29 small-prompt baseline"

# Authoring guidance for per-tier budget ceilings (implementation / review /
# fix), where the executing engine takes them. Ported defaults; engines may
# carry their own flat fallback.
[budget_guidance]
weak = { implementation = 3.00, review = 2.00, fix = 2.00 }
mid = { implementation = 8.00, review = 3.00, fix = 3.00 }
strong = { implementation = 20.00, review = 5.00, fix = 3.00 }
frontier = { implementation = 30.00, review = 10.00, fix = 6.00 }
