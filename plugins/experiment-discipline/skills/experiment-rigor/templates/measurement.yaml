# Measurement-tier skeleton. Adds a frozen pre-registration (analysis_plan with a
# structured decision_rule) and a reported CI per arm. Passes `validate.py
# --schema-only`. Under full validate.py it WARNs on ER-XCHECK (source: hand at
# measurement) and, until you freeze the plan and set plan_frozen_at.commit to a real
# SHA, flags ER-ANCHOR / ER-PREREG -- fill those in before you rely on the full gate.
#
# Activation line -- the work product this record backs opens with it, generated from
# the record rather than typed so the claim cannot drift from the artifact:
# `python scripts/render.py --activation-line <record>` prints
#   [experiment-rigor | measurement -> <record path, relative to the repo root>]
# and `render.py --check-activation-line "<line>" <record>` exits 1 when the pasted
# line's tier or path disagrees with the record. The generated format is ASCII by
# construction (its literals sit under the ASCII ratchet); a glyph-prefixed variant is
# a hand-written annotation only, never generated.
#
# This skeleton models the shared-task case at its WEAKEST: `shared_tasks: true` with
# only per-arm Wilson intervals. Those price independent trials on a design whose unit
# is the prompt, so they are DESCRIPTIVE -- an upper bound on precision -- and the
# headline belongs on the clustered scale. Add the two blocks below under
# `results.footprint`, with your own counts (a record using them should also say
# `schema_version: 1.1`, though the gates key off the blocks, not the declaration: a
# stated contrast is recomputed whichever version the record declares):
#
#     clusters:                              # per prompt id, per arm
#       p1:
#         with_gate: {numerator: 4, denominator: 4}
#         without_gate: {numerator: 2, denominator: 4}
#       p2:
#         with_gate: {numerator: 3, denominator: 4}
#         without_gate: {numerator: 2, denominator: 4}
#       # ... one entry per shared prompt
#     contrasts:
#       - name: with_gate_minus_without_gate
#         arms: [with_gate, without_gate]    # the ORDERED pair [minuend, subtrahend]
#         estimator: paired_difference
#         estimate: 0.2083
#         se: 0.1193
#         n_clusters: 6
#         interval:
#           method: paired_t
#           alpha: 0.05
#           low: -0.0984
#           high: 0.515
#           t_quantile: 2.5706
#         sign_test:                         # required beside the approximate interval
#           p_value: 0.375                   # a zero delta is dropped by the tie rule
#           effective_n: 5
#           positive: 4
#
# ER-STATS recomputes every one of those numbers from the clusters block and echoes
# the recomputed sign test beside the contrast, so run validate.py and copy the values
# it reports rather than deriving them by hand. A worked record is at
# scripts/fixtures/paired_contrast.yaml; the field shapes are in templates/SCHEMA.md
# ("The paired contrast") and the assumptions in references/small-n-stats.md
# ("The paired scale").
schema_version: 1
tier: measurement
experiment: my-measurement-experiment
design:
  shared_tasks: true
  cells:
    - name: with_gate
      planned_n: 48
    - name: without_gate
      planned_n: 48
disposition:
  completed: 96
  excluded: 0
  total: 96
outcomes:
  - name: footprint
    role: exploratory
    operationalization: regex presence of the footprint marker in the run output
    verifier:
      path: verify.py
      hash: REPLACE_WITH_VERIFIER_SHA256
analysis_plan:
  ci_method: wilson
  comparison: with_gate vs without_gate
  decision_rule:
    metric: rate
    comparison: gt
    threshold: 0.1
    direction: higher
results:
  footprint:
    verdict: exploratory_signal
    paired: true
    arms:
      with_gate:
        numerator: 36
        denominator: 48
        ci:
          method: wilson
          alpha: 0.05
          low: 0.6122
          high: 0.8508
      without_gate:
        numerator: 18
        denominator: 48
        ci:
          method: wilson
          alpha: 0.05
          low: 0.2522
          high: 0.5164
threats:
  contamination_familiarity:
    status: residual
    statement: models may have seen structurally similar tasks in pretraining
  prompt_format_sensitivity:
    status: controlled
    statement: one fixed prompt template across arms
  judge_bias:
    status: controlled
    statement: deterministic regex verifier, no LLM judge
  model_version_drift:
    status: residual
    statement: single unpinned snapshot for the measurement window
  nondeterminism:
    status: residual
    statement: sampling temperature above zero
  construct_validity_proxy:
    status: residual
    statement: marker presence is a proxy for the underlying behavior
  token_length_confound:
    status: controlled
    statement: output token budget capped equally across arms
  selection_exclusion:
    status: controlled
    statement: no trials excluded
  generalization:
    status: residual
    statement: one task family only
plan_frozen_at:
  commit: REPLACE_WITH_FREEZE_COMMIT_SHA
  timestamp: 2026-01-01T00:00:00
run:
  source: hand
  hand_reason: replace with why no fathom ledger backs this run
  first_run_at: 2026-02-01T00:00:00
