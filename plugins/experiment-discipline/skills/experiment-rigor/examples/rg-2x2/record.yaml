outcomes:
- name: activation
  role: confirmatory
  operationalization: the model invoked the Skill tool to LOAD the target skill (ingest its body), measured
    from the raw event stream -- not the 'Skill check:' ritual declaration line, which is a separate,
    weaker signal.
  verifier:
    path: verify_activation.py
    hash: 1f0a9c7b2d4e6f8a0c1e3d5f709182a3b4c5d6e7f80912a3b4c5d6e7f8091a2b3
- name: footprint
  role: exploratory
  operationalization: behavioral proxies measured by a deterministic verifier on the executed workspace
    artifact -- a root-cause fix that also corrects a second latent point never named in the prompt; the
    subtle data-output error caught; a regression test left that goes red if the bug returns. Measures
    the named discipline, not generic care.
  verifier:
    path: verify_footprint.py
    hash: 2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2
analysis_plan:
  ci_method: wilson
  comparison: with_gate (gate + both) vs without_gate (ctrl + reg), pooled across the two model tiers,
    paired on the 6 shared tasks.
  decision_rule:
    metric: rate_difference
    comparison: gte
    threshold: 0.1
    direction: higher
  amendments:
  - commit: ed3c5a0e02f4b1fe5d60047e1bc43b88a91be4b2
    timestamp: '2026-07-24T00:00:00Z'
    scope: wave-2
    governs_first_run_at: '2026-07-24T18:00:00Z'
    note: wave-2 confirmation bar (+4/12) for the exploratory footprint, fixed after the wave-1 post-hoc
      signal and before wave-2. In this reconstruction the whole pre-registration is frozen at a single
      commit, so the amendment anchors to the freeze commit (documented choice; a live sequential design
      would carry a distinct between-waves commit).
threats:
  contamination_familiarity:
    status: residual
    statement: models may have seen structurally similar planted-bug tasks in pretraining; not controlled
      for.
  prompt_format_sensitivity:
    status: controlled
    statement: one fixed task template across arms; the register factor rewrote only the skill description
      field (bodies byte-identical, no new content words, length within 25%).
  judge_bias:
    status: controlled
    statement: a deterministic verifier on the executed artifact, no LLM-as-judge.
  model_version_drift:
    status: residual
    statement: two unpinned model snapshots (haiku, sonnet) over the measurement window; the instrument
      can move underneath the run.
  nondeterminism:
    status: residual
    statement: sampling temperature above zero; one turn per trial, not repeated.
  construct_validity_proxy:
    status: residual
    statement: the proxy measures the named discipline (the correct plate), but the skills were never
      loaded -- the behavior was auto-generated from the model's own priors, so the positive footprint
      bypasses the skill machinery and holds only for disciplines within the model's latent reach (the
      attentive-driver-watching-the-wrong-risk caveat).
  token_length_confound:
    status: residual
    statement: the gate arms carried roughly 90 more system-prompt words; no equal-length no-decision
      control was run, so forced deliberation cannot be separated from any preamble / extra reasoning
      tokens. Possibly fatal to the causal reading.
  selection_exclusion:
    status: controlled
    statement: no trials excluded; the full 96 are in the disposition.
  generalization:
    status: residual
    statement: one task family, one turn, tested as system-prompt TEXT rather than the per-prompt hook
      that would be built; 'validates the mechanism' would overclaim.
plan_frozen_at:
  commit: ed3c5a0e02f4b1fe5d60047e1bc43b88a91be4b2
  path: plugins/humblepowers/skills/experiment-rigor/examples/rg-2x2/record.yaml
